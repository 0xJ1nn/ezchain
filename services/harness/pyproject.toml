[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ezchain-harness"
version = "0.1.0"
description = "ezCHAIN agent harness: model clients and a headless session command"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1"]

[project.scripts]
ezchain-harness = "ezchain_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
