[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ezchain-harness"
version = "0.1.0"
description = "ezCHAIN agent harness: Anthropic Messages and OpenAI-compatible model clients"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]
