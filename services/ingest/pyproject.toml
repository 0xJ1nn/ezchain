[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ezchain-ingest"
version = "0.1.0"
description = "ezCHAIN market/chain data acquisition and normalization"
requires-python = ">=3.11"
dependencies = ["ezchain-core>=0.1.0"]

[tool.setuptools.packages.find]
where = ["src"]
