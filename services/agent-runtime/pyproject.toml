[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ezchain-agent-runtime"
version = "0.1.0"
description = "ezCHAIN built-in agent runtime: one model loop over the MCP tool surface"
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
