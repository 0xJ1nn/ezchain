[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ezchain-executor"
version = "0.1.0"
description = "ezCHAIN execution: the only key holder, and the single order pipeline"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
