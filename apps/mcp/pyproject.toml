[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ezchain-mcp"
version = "1.0.0"
description = "MCP server for the ezCHAIN paper trading API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
dependencies = ["httpx>=0.27,<1"]

[project.scripts]
ezchain-mcp = "ezchain_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
