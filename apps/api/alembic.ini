# Alembic configuration for apps/api.
#
# The database URL is NEVER stored here. env.py reads ``get_settings().database_url``
# (EZCHAIN_DATABASE_URL) or an explicit URL passed by ``ezchain_api.migrate``.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .:apps/api/src:packages/core-py/src:packages/adapters/src:services/engine/src
path_separator = os
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
