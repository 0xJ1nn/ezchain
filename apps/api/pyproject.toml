[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ezchain-api"
version = "0.1.0"
description = "ezCHAIN HTTP edge"
requires-python = ">=3.11"

[project.scripts]
ezchain-api = "ezchain_api.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
