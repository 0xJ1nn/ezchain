[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ezchain-api"
version = "0.1.0"
description = "ezCHAIN HTTP edge"
requires-python = ">=3.11"

# The OS-keyring secret store is optional: a deployment that stores provider keys in the
# keyring installs ``ezchain-api[keyring]``. ``age`` is a binary on PATH, not a package.
[project.optional-dependencies]
keyring = ["keyring>=24,<26"]

[project.scripts]
ezchain-api = "ezchain_api.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
