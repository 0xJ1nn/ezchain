global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api
    static_configs: [{ targets: ["api:8000"] }]
  - job_name: engine
    static_configs: [{ targets: ["engine:8001"] }]
  - job_name: executor
    static_configs: [{ targets: ["executor:8010"] }]
  - job_name: ingest
    static_configs: [{ targets: ["ingest:8002"] }]
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
