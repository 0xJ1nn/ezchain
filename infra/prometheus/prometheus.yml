# Prometheus for the PAPER stack (observability profile).
# Only targets that exist in infra/compose.yaml are listed. Do not add
# engine/executor/ingest jobs until those deployables exist.

global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    # The API serves /metrics to loopback or with the operator token. The Compose
    # file mounts that token at this path for the observability profile.
    authorization:
      credentials_file: /etc/prometheus/api-token
    static_configs:
      - targets: ["api:8000"]

  # Prometheus scrapes itself so `up` and the alert rules have a second target
  # that proves the config is live.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
