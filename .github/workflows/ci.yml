name: gates

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs-design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: agent stubs are generated from AGENTS.md
        run: node tools/sync-agent-stubs.mjs --check
      - name: wireframe integrity
        run: node tools/check-wireframe.mjs
      - name: markdown links
        run: node tools/check-links.mjs
      - name: no secret-shaped strings
        run: node tools/check-secrets.mjs

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: validate deployment contract
        run: docker compose --env-file infra/.env.example -f infra/compose.yaml config -q
