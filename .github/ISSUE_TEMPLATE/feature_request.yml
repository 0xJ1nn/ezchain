name: Feature request
description: Propose a capability, screen or integration.
title: "[Feature]: "
labels: ["feature", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who is stuck, doing what, and why the current app cannot help.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - New screen / UI
        - Existing screen
        - Automation
        - Strategy SDK
        - Chain adapter
        - Venue adapter
        - Data / signals
        - Infra / ops
        - API
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This is platform functionality, not a bundled trading strategy
          required: true
        - label: I checked docs/PRODUCT.md for non-goals
          required: true
